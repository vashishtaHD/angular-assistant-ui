version: 2
updates:
  # The root workspace: the library, the demo and the Mastra server share one lockfile.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    # A dependency joins the first group that matches it.
    groups:
      angular:
        patterns: ['@angular/*', '@angular-devkit/*', 'angular-eslint', 'ng-packagr', 'zone.js']
      assistant-ui:
        patterns: ['@assistant-ui/*', 'assistant-stream']
      ai-sdk:
        patterns: ['ai', '@ai-sdk/*']
      mastra:
        patterns: ['mastra', '@mastra/*']
      everything-else:
        patterns: ['*']
    ignore:
      # The workspace builds and tests on the Angular 18.2 floor, and its toolchain (TypeScript,
      # Vitest, Analog, Tailwind, ESLint) is held to versions that floor supports. Newer Angular
      # majors are covered by compat/; toolchain majors are raised by hand.
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
      # Pinned exactly: angular-assistant-ui/mastra vendors code from this version, so raising it
      # means re-vendoring (see docs/porting.md).
      - dependency-name: '@assistant-ui/ai-sdk'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
