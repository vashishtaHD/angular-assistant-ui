name: CI

on:
  push:
    # Branches only: a release tag runs this workflow through release.yml (workflow_call).
    branches: ['**']
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck:lib-spec
      - run: npm run test:scripts
      # docs/porting.md: every parity row is `ported` or `n/a (reason)`, none `planned`.
      - run: npm run check:parity
      # Every non-spec .ts source names its upstream source or says it is original.
      - run: npm run check:headers
      - run: npm test
      # Builds the main entry and every secondary entry (ui, markdown, shiki, mastra,
      # testing, react-interop) into dist/assistant-ui-angular.
      - run: npm run build:lib
      - run: npm run check:ui-styles
      # No FESM imports a React-19-only API (useEffectEvent, ...) straight from react.
      - run: npm run check:react-compat
      # Packs it as published; the compat jobs check the tarball's entries,
      # ui/styles.css, LICENSE and NOTICE.
      - run: npm pack ./dist/assistant-ui-angular --dry-run
      # The packed file list (README, LICENSE, NOTICE, every entry, ui/styles.css, nothing
      # stray) and a publishable package.json, including a sideEffects that keeps the CSS.
      - run: npm run check:package
      # The TypeScript samples of both READMEs type-check against the build.
      - run: npm run check:readme-samples
      - run: npm run build:demo
      - run: npm run typecheck:mastra
      - uses: actions/upload-artifact@v4
        with:
          name: lib-dist
          path: dist/assistant-ui-angular
          retention-days: 1

  # Packs the library (checking every secondary entry, ui/styles.css, LICENSE and
  # NOTICE are in the tarball), installs it into real consumer apps on Angular 18.2
  # and 20 (Zone.js) and 22 (zoneless), builds them and runs the styled-kit
  # Playwright smoke test (compat/smoke.spec.ts).
  compat:
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [ng18, ng20, ng22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Latest Node 22; the Angular 22 CLI needs ^22.22.3 or ^24.15.0.
          node-version: 22
          cache: npm
          cache-dependency-path: |
            compat/package-lock.json
            compat/${{ matrix.app }}/package-lock.json
      # The library built by `verify`, used as is (--no-build).
      - uses: actions/download-artifact@v4
        with:
          name: lib-dist
          path: dist/assistant-ui-angular
      - run: npm ci --no-audit --no-fund
        working-directory: compat
      - run: npx playwright install --with-deps chromium
        working-directory: compat
      - run: npm run compat -- ${{ matrix.app }} --no-build
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces-${{ matrix.app }}
          path: compat/test-results/
          if-no-files-found: ignore
