name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck:lib-spec
      - run: npm test
      - run: npm run build:lib
      - run: npm run build:demo
      - run: npm run typecheck:mastra
      - uses: actions/upload-artifact@v4
        with:
          name: lib-dist
          path: dist/assistant-ui-angular
          retention-days: 1

  # Installs the packed library into real consumer apps on Angular 18.2 and 20
  # (Zone.js) and 22 (zoneless), builds them and runs a Playwright smoke test.
  compat:
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [ng18, ng20, ng22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Latest Node 22; the Angular 22 CLI needs >= 22.22.3.
          node-version: 22
          cache: npm
          cache-dependency-path: |
            compat/package-lock.json
            compat/${{ matrix.app }}/package-lock.json
      # The library built by `verify`, used as is (--no-build).
      - uses: actions/download-artifact@v4
        with:
          name: lib-dist
          path: dist/assistant-ui-angular
      - run: npm ci --no-audit --no-fund
        working-directory: compat
      - run: npx playwright install --with-deps chromium
        working-directory: compat
      - run: npm run compat -- ${{ matrix.app }} --no-build
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces-${{ matrix.app }}
          path: compat/test-results/
          if-no-files-found: ignore
