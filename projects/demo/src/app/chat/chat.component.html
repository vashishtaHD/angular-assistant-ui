<ng-container [auiProvider]="config">
  <div auiThreadRoot appChatTools class="flex h-full flex-col bg-slate-50 text-slate-900">
    <header class="border-b border-slate-200 bg-white/80 backdrop-blur">
      <div class="mx-auto flex max-w-3xl items-center gap-2 px-4 py-3">
        <span class="size-2 rounded-full bg-emerald-500" aria-hidden="true"></span>
        <h1 class="text-sm font-semibold tracking-tight">Mastra chat</h1>
        <span class="text-sm text-slate-400">angular-assistant-ui demo</span>
      </div>
    </header>

    <div auiThreadViewport class="min-h-0 flex-1 overflow-y-auto">
      <div class="mx-auto flex max-w-3xl flex-col gap-4 px-4 py-6">
        <div *auiIf="isEmpty" class="mt-24 text-center text-slate-400">
          <p class="text-lg font-medium text-slate-600">How can I help?</p>
          <p class="mt-1 text-sm">Try “What’s the weather in Paris?”</p>
        </div>

        <aui-thread-messages>
          <ng-template auiMessage>
            <div
              auiMessageRoot
              class="group flex data-[role=user]:justify-end data-[role=assistant]:justify-start"
            >
              <div
                class="max-w-[85%] rounded-2xl px-4 py-2 leading-relaxed group-data-[role=user]:rounded-br-sm group-data-[role=user]:bg-slate-900 group-data-[role=user]:text-white group-data-[role=assistant]:rounded-bl-sm group-data-[role=assistant]:bg-white group-data-[role=assistant]:shadow-sm group-data-[role=assistant]:ring-1 group-data-[role=assistant]:ring-slate-200"
              >
                <aui-message-parts>
                  <ng-template auiPart="text" let-part>
                    <p class="whitespace-pre-wrap">{{ part.type === 'text' ? part.text : '' }}</p>
                  </ng-template>
                </aui-message-parts>
                <span *auiIf="isWaiting" class="flex gap-1 py-2" aria-label="Thinking">
                  <span class="size-1.5 animate-bounce rounded-full bg-slate-400"></span>
                  <span
                    class="size-1.5 animate-bounce rounded-full bg-slate-400 [animation-delay:150ms]"
                  ></span>
                  <span
                    class="size-1.5 animate-bounce rounded-full bg-slate-400 [animation-delay:300ms]"
                  ></span>
                </span>
                <p *auiIf="isError" role="alert" class="text-sm text-rose-600">
                  Something went wrong. Please try again.
                </p>
              </div>
            </div>
          </ng-template>
        </aui-thread-messages>
      </div>
    </div>

    <div class="border-t border-slate-200 bg-white">
      <form auiComposerRoot class="mx-auto flex max-w-3xl items-end gap-2 px-4 py-3">
        <textarea
          auiComposerInput
          aria-label="Message"
          placeholder="Send a message…"
          class="min-h-10 flex-1 resize-none rounded-xl border border-slate-300 bg-white px-3 py-2 text-sm leading-6 outline-none placeholder:text-slate-400 focus:border-slate-500 focus:ring-2 focus:ring-slate-200"
        ></textarea>
        <button
          *auiIf="isIdle"
          auiComposerSend
          aria-label="Send"
          class="h-10 rounded-xl bg-slate-900 px-4 text-sm font-medium text-white transition hover:bg-slate-700 disabled:cursor-not-allowed disabled:opacity-40"
        >
          Send
        </button>
        <button
          *auiIf="isRunning"
          auiComposerCancel
          aria-label="Stop"
          class="flex h-10 items-center gap-2 rounded-xl border border-slate-300 bg-white px-4 text-sm font-medium text-slate-700 transition hover:bg-slate-100"
        >
          <span class="size-2.5 rounded-sm bg-slate-700" aria-hidden="true"></span>
          Stop
        </button>
      </form>
    </div>
  </div>
</ng-container>
